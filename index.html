<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bedroom Layout Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: drafting-table app — plan canvas fills the screen, a quiet control rail on the right (stacks below on phones). */
:root {
  --paper: #EEF2F1;
  --panel: #FFFFFF;
  --ink: #1C2B2A;
  --muted: #5B6D6A;
  --line: #D3DCDA;
  --accent: #2457C5;
  --accent-soft: #E3EBFA;
  --on-accent: #FFFFFF;
  --floor: #FBFCFB;
  --wall: #26312F;
  --grid: #E1E8E6;
  --glass: #B9DCEE;
  --zone: rgba(36, 87, 197, .09);
  --zone-line: rgba(36, 87, 197, .45);
  --bad: #CF3328;
  --bad-soft: rgba(207, 51, 40, .14);
  --warn: #B87A00;
  --ok: #1D8A57;
  --k-bed: #DCE5F6;
  --k-storage: #EBDFCC;
  --k-seat: #DAEADB;
  --k-table: #ECE0EE;
  --k-rug: #F3ECDA;
  --k-fixed: #CBD1CF;
  --k-stroke: #3A4A48;
  --shadow: 0 1px 2px rgba(20, 35, 33, .08), 0 4px 16px rgba(20, 35, 33, .06);
  --sans: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111715; --panel: #19211F; --ink: #E3EBE9; --muted: #92A4A0; --line: #2B3835;
    --accent: #7AA2FF; --accent-soft: #1E2B47; --on-accent: #0D1424; --floor: #161D1B; --wall: #C5D1CE;
    --grid: #202C29; --glass: #2C5A70; --zone: rgba(122, 162, 255, .12); --zone-line: rgba(122, 162, 255, .5);
    --bad: #FF6A5E; --bad-soft: rgba(255, 106, 94, .16); --warn: #F0B43C; --ok: #4CC38A;
    --k-bed: #243453; --k-storage: #463A2A; --k-seat: #24402D; --k-table: #3F2E46; --k-rug: #37311F; --k-fixed: #384240;
    --k-stroke: #A7B8B4; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111715; --panel: #19211F; --ink: #E3EBE9; --muted: #92A4A0; --line: #2B3835;
  --accent: #7AA2FF; --accent-soft: #1E2B47; --on-accent: #0D1424; --floor: #161D1B; --wall: #C5D1CE;
  --grid: #202C29; --glass: #2C5A70; --zone: rgba(122, 162, 255, .12); --zone-line: rgba(122, 162, 255, .5);
  --bad: #FF6A5E; --bad-soft: rgba(255, 106, 94, .16); --warn: #F0B43C; --ok: #4CC38A;
  --k-bed: #243453; --k-storage: #463A2A; --k-seat: #24402D; --k-table: #3F2E46; --k-rug: #37311F; --k-fixed: #384240;
  --k-stroke: #A7B8B4; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.45 var(--sans); }
button, input, select, textarea { font: inherit; color: inherit; }

.app { height: 100%; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; gap: 12px; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; }
.brand h1 { font-size: 18px; font-weight: 700; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.brand .scale { font: 500 11px var(--mono); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 11px;
  border: 1px solid var(--line); background: var(--panel); border-radius: 7px; cursor: pointer; white-space: nowrap; font-weight: 500; font-size: 13px; }
.btn:hover { border-color: var(--muted); }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: var(--panel); border-color: var(--bad); }
.btn.icon { width: 32px; padding: 0; }
.btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; height: 30px; padding: 0 11px; cursor: pointer; font-weight: 500; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.seg button svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

select.layout-sel { height: 32px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); padding: 0 8px; max-width: 200px; }

/* Work area */
.work { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; }
.stage { position: relative; min-width: 0; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
#plan { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; display: block; }
#plan.measure { cursor: crosshair; }
#plan.panning { cursor: grabbing; }

.tools { position: absolute; top: 10px; left: 10px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 20px); pointer-events: none; }
.tools > * { pointer-events: auto; box-shadow: var(--shadow); }
.selbar { position: absolute; bottom: 44px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); max-width: calc(100% - 20px); flex-wrap: wrap; justify-content: center; }
.selbar .nm { font-weight: 600; padding: 0 6px; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hint { position: absolute; left: 10px; right: 10px; bottom: 10px; font-size: 12px; color: var(--muted); pointer-events: none; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.legend { display: flex; gap: 10px; align-items: center; font: 500 11px var(--mono); }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }

/* Sidebar */
.side { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 4px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.card.insp { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.card h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card h2 small { font: 500 11px var(--mono); letter-spacing: 0; text-transform: none; color: var(--muted); }
.note { margin: 0; font-size: 12px; color: var(--muted); }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500; min-width: 0; }
label.f input, label.f select { height: 34px; border: 1px solid var(--line); border-radius: 7px; background: var(--floor); color: var(--ink); padding: 0 9px; font: 500 13px var(--mono); width: 100%; min-width: 0; }
label.f input[type="text"].name { font-family: var(--sans); font-size: 14px; }
label.f input.err { border-color: var(--bad); background: var(--bad-soft); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }

.presets { display: flex; flex-direction: column; gap: 8px; }
.presets .grp { font: 500 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { border: 1px solid var(--line); background: var(--floor); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; }
.chip:hover { border-color: var(--accent); }
.chip span { font: 400 11px var(--mono); color: var(--muted); }

.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.list button { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 7px 10px; text-align: left; cursor: pointer; width: 100%; }
.list button + button { border-top: 1px solid var(--line); }
.list button:hover { background: var(--accent-soft); }
.list button.on { background: var(--accent-soft); font-weight: 600; }
.list .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; border: 1px solid var(--k-stroke); }
.list .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .dim { font: 400 11.5px var(--mono); color: var(--muted); white-space: nowrap; }
.list .flag { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); flex: none; }
.f-lab, .presets .grp, .card > .grp { font: 500 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.sub { font: 400 11px var(--mono); color: var(--muted); text-transform: none; letter-spacing: 0; }
.shapes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.shape { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--floor); cursor: pointer; font-size: 11.5px; line-height: 1.2; text-align: center; }
.shape:hover { border-color: var(--accent); }
.shape svg { width: 44px; height: 32px; }
.shape svg polygon { fill: var(--k-bed); stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; }
.walls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.wrow { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 7px; padding: 3px 3px 3px 3px; background: var(--floor); min-width: 0; }
.wrow.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.wrow .wl { width: 26px; height: 26px; flex: none; border: 0; border-radius: 5px; background: var(--ink); color: var(--panel); font: 700 12px var(--mono); cursor: pointer; }
.wrow.on .wl { background: var(--accent); color: var(--on-accent); }
.wrow .wd { font: 500 13px var(--mono); color: var(--muted); width: 26px; text-align: center; flex: none; }
.wrow input { flex: 1; min-width: 0; height: 26px; border: 0; background: transparent; font: 500 13px var(--mono); color: var(--ink); padding: 0 4px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font: 500 16px var(--mono); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11.5px; color: var(--muted); }
.issues { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.issues li button { width: 100%; text-align: left; border: 1px solid var(--bad); background: var(--bad-soft); color: var(--ink); border-radius: 8px; padding: 7px 10px; cursor: pointer; font-size: 13px; }
.allgood { display: flex; gap: 8px; align-items: center; color: var(--ok); font-weight: 600; font-size: 13px; }
.allgood svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.example-tag { font: 500 11px var(--mono); color: var(--warn); text-transform: uppercase; letter-spacing: .06em; }

/* SVG */
#plan text { font-family: var(--mono); fill: var(--ink); }
#plan .grid { stroke: var(--grid); stroke-width: 1; vector-effect: non-scaling-stroke; }
#plan .floor { fill: var(--floor); }
#plan .wall { fill: var(--wall); }
#plan .gap { fill: var(--floor); }
#plan .glass { fill: var(--glass); stroke: var(--wall); stroke-width: 1; vector-effect: non-scaling-stroke; }
#plan .op { cursor: grab; }
#plan .op.sel .gap, #plan .op.sel .glass { fill: var(--accent); }
#plan .leaf { stroke: var(--k-stroke); stroke-width: 2; vector-effect: non-scaling-stroke; fill: none; }
#plan .arc { stroke: var(--k-stroke); stroke-width: 1; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; fill: none; }
#plan .zone { fill: var(--zone); stroke: var(--zone-line); stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
#plan .op.sel .zone { stroke: var(--accent); stroke-dasharray: none; }
#plan .oplabel { fill: var(--muted); }
#plan .dimline { stroke: var(--muted); stroke-width: 1; vector-effect: non-scaling-stroke; }
#plan .dimtext { fill: var(--muted); font-weight: 500; }

#plan .it { cursor: grab; }
#plan .it.locked { cursor: pointer; }
#plan .it .body { stroke: var(--k-stroke); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
#plan .it .deco { fill: none; stroke: var(--k-stroke); stroke-width: 1; vector-effect: non-scaling-stroke; opacity: .7; }
#plan .it .band { fill: var(--k-stroke); opacity: .55; }
#plan .it .pillow { fill: var(--panel); stroke: var(--k-stroke); stroke-width: 1; vector-effect: non-scaling-stroke; }
#plan .k-bed .body { fill: var(--k-bed); }
#plan .k-storage .body { fill: var(--k-storage); }
#plan .k-seat .body { fill: var(--k-seat); }
#plan .k-table .body { fill: var(--k-table); }
#plan .k-rug .body { fill: var(--k-rug); fill-opacity: .8; stroke-dasharray: 5 3; }
#plan .k-fixed .body { fill: var(--k-fixed); }
#plan .it.bad .body { stroke: var(--bad); stroke-width: 2.2; }
#plan .it.bad .hatch { fill: url(#hatch); }
#plan .it .selring { fill: none; stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-dasharray: 6 4; }
#plan .itlabel { font-weight: 500; }
#plan .itdim { fill: var(--muted); }
#plan .hatchline { stroke: var(--bad); stroke-width: 1.2; }

#plan .gl { stroke-width: 1.6; vector-effect: non-scaling-stroke; }
#plan .gl.bad { stroke: var(--bad); } #plan .gl.warn { stroke: var(--warn); } #plan .gl.ok { stroke: var(--ok); }
#plan .pill { stroke: none; }
#plan .pill.bad { fill: var(--bad); } #plan .pill.warn { fill: var(--warn); } #plan .pill.ok { fill: var(--ok); }
#plan .pilltext { fill: var(--panel); font-weight: 500; }
#plan .meas line { stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; }
#plan .meas .hit { stroke: transparent; stroke-width: 14; }
#plan .meas .pill { fill: var(--accent); }
#plan .meas .pilltext { fill: var(--on-accent); }
#plan .meas.sel line:not(.hit) { stroke-dasharray: 6 3; }
#plan .meas { cursor: pointer; }
#plan .wallpoly { fill: var(--wall); stroke: var(--wall); stroke-linejoin: miter; stroke-miterlimit: 6; }
#plan .wallhit { stroke: transparent; cursor: move; }
#plan .wallsel { stroke: var(--accent); }
#plan .wlabel { fill: var(--muted); font-weight: 500; }
#plan .wlabel .wletter { fill: var(--ink); font-weight: 700; }
#plan .wlabel.sel, #plan .wlabel.sel .wletter { fill: var(--accent); }
#plan .corner { fill: var(--panel); stroke: var(--k-stroke); stroke-width: 1.5; vector-effect: non-scaling-stroke; cursor: move; }
#plan .corner:hover { stroke: var(--accent); }
#plan .corner.sel { fill: var(--accent); stroke: var(--accent); }
#plan .gl.acc { stroke: var(--accent); }
#plan .pill.acc { fill: var(--accent); }
#plan .pill.acc + .pilltext { fill: var(--on-accent); }
#plan .snapdot { fill: var(--accent); }
#plan .trim { fill: var(--k-stroke); }

/* Backup panel */
.overlay { position: fixed; inset: 0; background: rgba(10, 18, 16, .45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; width: min(560px, 100%); max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.sheet h3 { margin: 0; font-size: 16px; }
.sheet textarea { width: 100%; height: 110px; border: 1px solid var(--line); border-radius: 8px; background: var(--floor); padding: 8px; font: 12px var(--mono); resize: vertical; }

@media (max-width: 860px) {
  .app { height: auto; min-height: 100%; }
  .work { grid-template-columns: minmax(0, 1fr); }
  .stage { height: 68vh; min-height: 380px; }
  .side { overflow: visible; }
  .brand .scale { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1>Bedroom Layout Planner</h1><span class="scale" id="scaleNote">Top-down · to scale</span></div>
    <div class="group">
      <select class="layout-sel" id="layoutSel" aria-label="Choose layout"></select>
      <button class="btn" id="dupLayout" title="Copy this layout so you can try a different arrangement">Duplicate</button>
      <button class="btn" id="newLayout" title="Start a new empty room">New room</button>
      <button class="btn danger" id="delLayout">Delete</button>
    </div>
    <div class="group">
      <div class="seg" role="group" aria-label="Units">
        <button id="uImp" aria-pressed="true">ft / in</button><button id="uMet" aria-pressed="false">cm</button>
      </div>
      <button class="btn icon" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="btn icon" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
      <button class="btn" id="backupBtn">Save / share</button>
    </div>
  </header>

  <main class="work">
    <section class="stage" id="stage">
      <svg id="plan" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Floor plan"></svg>
      <div class="tools">
        <div class="seg" role="group" aria-label="Tool">
          <button id="tMove" aria-pressed="true" title="Move furniture (V)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-3 6z"/></svg>Move</button>
          <button id="tMeasure" aria-pressed="false" title="Measure a distance (M)"><svg viewBox="0 0 24 24"><path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></svg>Measure</button>
        </div>
        <div class="seg" role="group" aria-label="Zoom">
          <button id="zOut" title="Zoom out" aria-label="Zoom out">−</button>
          <button id="zFit" title="Fit room to screen">Fit</button>
          <button id="zIn" title="Zoom in" aria-label="Zoom in">+</button>
        </div>
        <div class="seg" role="group" aria-label="View options">
          <button id="oGaps" aria-pressed="true" title="Show distances around the selected piece">Clearances</button>
          <button id="oSnap" aria-pressed="true" title="Snap to walls and other furniture">Snap</button>
          <button id="oGrid" aria-pressed="true" title="Show grid">Grid</button>
        </div>
        <button class="btn" id="clearMeas" hidden>Clear measurements</button>
      </div>
      <div class="selbar" id="selbar" hidden></div>
      <div class="hint"><span id="hint"></span><span class="legend" id="legend"></span></div>
    </section>
    <aside class="side" id="side"></aside>
  </main>
</div>

<div class="overlay" id="backup" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="bkTitle">
    <h3 id="bkTitle">Save or share your layouts</h3>
    <p class="note">Your layouts save automatically in this browser. To keep a backup, move to another device, or send to someone, copy the code below. To load layouts, paste a code into the second box.</p>
    <textarea id="bkOut" readonly aria-label="Layout code"></textarea>
    <div class="btns"><button class="btn primary" id="bkCopy">Copy code</button><span class="note" id="bkMsg"></span></div>
    <textarea id="bkIn" placeholder="Paste a layout code here" aria-label="Paste layout code"></textarea>
    <div class="btns"><button class="btn" id="bkLoad">Add these layouts</button><button class="btn" id="bkClose" style="margin-left:auto">Close</button></div>
  </div>
</div>

<script>
(() => {
'use strict';
const WALL = 5; // drawn wall thickness, inches
const TRIM_DEFAULT = 3, TRIM_DEPTH = 0.75; // door casing: width each side, how far it stands off the wall
const KINDS = { bed: 'Bed', storage: 'Storage', seat: 'Seating', table: 'Table / desk', rug: 'Rug (can go under things)', fixed: 'Built-in / obstacle' };
const PRESETS = [
